name: HSK CRM - Code and safety checks
on:
  push:
    paths:
      - "crm/**"
      - ".github/workflows/hsk-crm-check.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Worker
        run: node --check crm/src/index.js
      - name: Test CRM APIs
        run: cd crm && node --test tests/*.test.mjs
